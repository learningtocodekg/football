name: "CB test — Slant (scripted QB)"
phase: A2
description: >
  1st and 10. WR runs a slant route. QB is scripted to throw at t=2.3s
  to the WR's expected post-cut position. Use this to iterate on CB
  behavior without spending QB tokens.

down: 1
distance: 10
wr_route: slant

# Scripted QB — no LLM calls, instant iteration
# Leads WR automatically based on flight time at throw time
qb_scripted: true
qb_throw_t: 2.3
qb_throw_mph: 50.0

# CB model settings
cb_model: "gpt-5-nano"
cb_reasoning_effort: "low"
cb_provider: "openai"
