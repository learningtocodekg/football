name: "A1 Basic — Slant (scripted QB+WR)"
phase: A1
description: >
  Default scenario. WR runs a scripted slant route. Scripted QB throws at t=3.0s.
  No LLM tokens spent on QB. CB is the only LLM agent.

down: 1
distance: 10
wr_route: slant

# Scripted QB — no LLM tokens, for CB development
qb_scripted: true
qb_throw_t: 3.0
qb_throw_mph: 50.0

# To use the LLM QB instead, comment the three lines above and uncomment below:
# qb_model: "gpt-5-nano"
# qb_reasoning_effort: "low"
# qb_provider: "openai"

cb_model: "gpt-5-nano"
cb_reasoning_effort: "low"
cb_provider: "openai"
