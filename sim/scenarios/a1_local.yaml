name: "A1 Local — Slant (scripted QB, Ollama CB)"
phase: A1
description: >
  WR runs a scripted slant route. Scripted QB. CB uses a local Ollama model.
  Run Ollama first: ollama serve

down: 1
distance: 10
wr_route: slant

# Scripted QB — no LLM tokens
qb_scripted: true
qb_throw_t: 3.0
qb_throw_mph: 50.0

# To use the LLM QB instead, comment the three lines above and uncomment below:
# qb_provider: "ollama"
# qb_model: "qwen3:8b"
# qb_reasoning_effort: null

cb_provider: "ollama"
cb_model: "qwen3:8b"
cb_reasoning_effort: null
