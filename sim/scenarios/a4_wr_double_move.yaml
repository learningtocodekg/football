name: "A4 — LLM WR + LLM QB + LLM CB, double move route"
phase: A4
description: >
  1st and 10. All three agents live. WR runs a double move — stem upfield (0–1.5s),
  fakes right at 90° (1.5–2.2s), then cuts back upfield (2.2s+) for the real break.
  The CB should bite on the first move and need to recover for the second cut.
  Tests: does the WR execute both phases cleanly? Does the QB wait for the real break?
  Does the CB react to the first cut and get caught going the wrong way?

